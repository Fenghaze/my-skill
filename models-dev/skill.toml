name = "models-dev"
description = "查询、对比AI大模型信息。当用户询问模型规格、能力对比、模型推荐，或提到以下场景时使用：查询某模型的上下文窗口/Token限制/支持的模态/推理能力；对比多个模型的优劣；根据场景推荐合适的模型；了解某提供商有哪些模型；筛选支持tool_call/open_weights/多模态的模型。注意：Models.dev 仅提供模型规格和技术能力数据，不包含价格信息。"
icon = "🔍"
color = "#6366F1"

[invoke]
description = "查询单个模型的详细信息"
argument {
  name = "query"
  type = "string"
  description = "要查询的模型名称、ID或关键词（如 \"claude\", \"gpt-4\", \"支持vision的模型\"）"
  required = true
}

[invoke]
description = "对比多个模型的规格和能力"
argument {
  name = "models"
  type = "string"
  description = "要对比的模型ID列表，用逗号分隔（如 \"claude-opus-4,gpt-4o,gemini-2-pro\"）"
  required = true
}

[invoke]
description = "列出提供商的所有模型"
argument {
  name = "provider"
  type = "string"
  description = "提供商名称或ID（如 \"anthropic\", \"openai\", \"google\"）"
  required = false
}

[setup]
description = "无需额外设置，直接使用 Models.dev 公开 API（https://models.dev/api.json）"

[triggers]
keywords = ["模型", "models.dev", "上下文窗口", "token限制", "支持的模态", "推理能力", "工具调用", "tool_call", "开源模型", "open_weights", "多模态", "vision", "对比模型", "模型对比", "模型推荐", "AI模型", "大模型", "LLM"]
patterns = ["\\b(gpt|claude|gemini|llama|deepseek|qwen|mistral|anthropic|openai|google)\\b.*(模型|model)", ".*(上下文|context|token|window)", ".*(推理|reasoning)", ".*(开源|open.?weights)", ".*(多模态|vision|multimodal)"]

[examples]
query = "查询 Claude Opus 4 的上下文窗口和支持的模态"
models = "对比 gpt-4o 和 gemini-2-pro 的能力"
provider = "列出 anthropic 提供商的所有模型"
